services:
  - type: web
    name: financeos-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://localhost:3000,https://ai-finance-controller-agent.vercel.app
      - key: OPENROUTER_API_KEY
        scope: build,run
